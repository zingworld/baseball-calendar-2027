<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>야구 달력 결정 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: 16:9 decision slides, three option cards per decision, each card renders a live mockup; stacked on phones */
:root{
  --ground:#e9ebef; --paper:#f7f6f2; --card:#ffffff; --ink:#1c2740; --muted:#5d6577; --line:#d9dbe1;
  --accent:#c8102e; --ok:#2f6b4f; --sel:#1c2740;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --num:"Barlow Condensed","Noto Sans KR",system-ui,sans-serif;
  --hand:"Gaegu","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121726; --paper:#1b2131; --card:#232b3e; --ink:#eef0f5; --muted:#a8afc0; --line:#374159;
  --accent:#ff5a6e; --ok:#5fb38a; --sel:#eef0f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#121726; --paper:#1b2131; --card:#232b3e; --ink:#eef0f5; --muted:#a8afc0; --line:#374159;
  --accent:#ff5a6e; --ok:#5fb38a; --sel:#eef0f5; color-scheme:dark}

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;box-sizing:border-box}
*{box-sizing:border-box}
.deck{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:18px}
.stage{width:min(100%,calc((100vh - 100px)*16/9));max-width:1320px}
.slide{position:relative;aspect-ratio:16/9;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(10,20,40,.45);container-type:inline-size;overflow:hidden;display:none}
.slide.on{display:block}
.slide::before{content:"";position:absolute;inset:0 0 auto 0;height:2.6cqi;background:radial-gradient(circle at 50% 70%,var(--ground) 0 .4cqi,transparent .45cqi) 0 0/2cqi 100% repeat-x;border-bottom:1px solid var(--line)}
.in{position:absolute;inset:4.2cqi 3.6cqi 3cqi 3.6cqi;display:flex;flex-direction:column;gap:1.4cqi;min-width:0}
.top{display:flex;align-items:baseline;gap:1.6cqi;flex-wrap:wrap}
.eyebrow{font-family:var(--num);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:1.25cqi}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:5cqi} h2{font-size:2.9cqi}
.hint{font-size:1.3cqi;color:var(--muted)}
p{margin:0;line-height:1.55}
.pg{position:absolute;right:3.6cqi;bottom:1.2cqi;font-family:var(--num);font-size:1.15cqi;color:var(--muted);letter-spacing:.08em}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqi;flex:1;min-height:0}
.opt{all:unset;overflow:hidden;min-height:0;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1.3cqi;display:flex;flex-direction:column;gap:.8cqi;min-width:0;position:relative;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--sel);box-shadow:inset 0 0 0 2px var(--sel)}
.opt .no{font-family:var(--num);font-weight:700;font-size:1.25cqi;letter-spacing:.1em;color:var(--muted)}
.opt.sel .no{color:var(--accent)}
.opt .badge{position:absolute;top:1.1cqi;right:1.1cqi;font-size:1.05cqi;font-weight:700;padding:.25cqi .8cqi;border-radius:99px;background:var(--sel);color:var(--card);display:none}
.opt.sel .badge{display:block}
.opt h3{margin:0;font-size:1.85cqi;font-weight:700}
.opt .desc{font-size:1.3cqi;color:var(--muted);line-height:1.45}
.opt .stage-mock{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--ground);border-radius:4px;overflow:hidden;padding:.8cqi}
.facts{display:flex;flex-wrap:wrap;gap:.5cqi}
.fact{font-size:1.15cqi;padding:.2cqi .7cqi;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.fact b{color:var(--ink);font-weight:700}

/* cover + summary */
.covergrid{display:grid;grid-template-columns:1.05fr 1fr;gap:3cqi;flex:1;min-height:0;align-items:center}
.list{display:flex;flex-direction:column;gap:.7cqi}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:2.6cqi 11cqi 1fr;gap:1cqi;align-items:center;padding:.8cqi 1cqi;border-radius:4px;background:var(--card);border:1px solid var(--line);font-size:1.35cqi}
.row:focus-visible{outline:2px solid var(--accent)}
.row .n{font-family:var(--num);font-weight:700;color:var(--muted)}
.row .k{font-weight:700}
.row .v{color:var(--muted)} .row .v.done{color:var(--ink)}
.row .v.done::before{content:"";display:inline-block;width:.8cqi;height:.8cqi;border-radius:50%;background:var(--ok);margin-right:.7cqi;vertical-align:middle}
.status{font-size:1.15cqi;color:var(--muted)}
.preview{display:flex;gap:1.6cqi;align-items:center;justify-content:center;background:var(--ground);border-radius:6px;padding:1.6cqi;min-height:0;height:100%}
.note{width:100%;font:inherit;font-size:1.3cqi;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.8cqi 1cqi;resize:none;height:6cqi}
.note:focus-visible{outline:2px solid var(--accent)}

/* ===== mockups (sized in em, wrapper sets font-size) ===== */
.mk{font-size:var(--mk,1cqi);display:flex;flex-direction:column;align-items:center;font-family:var(--body)}
.mk *{box-sizing:border-box}
.cal{position:relative;background:var(--p-paper);color:var(--p-ink);border-radius:.5em;box-shadow:0 .4em 1em -.5em rgba(0,0,0,.45);display:flex;flex-direction:column;padding:1.6em 1.1em .9em;overflow:hidden}
.cal::before{content:"";position:absolute;left:.8em;right:.8em;top:.35em;height:.9em;background:radial-gradient(circle,var(--p-ring) 0 .22em,transparent .26em) 0 50%/1.05em 100% repeat-x}
.cal.wide{width:34em;height:20em;flex-direction:row;gap:1em;padding:1.7em 1.1em .9em}
.stand{width:35em;height:2.2em;background:var(--p-stand);clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);border-radius:0 0 .3em .3em;margin-top:-.2em}
.cal.sideonly{width:16em;height:20em;flex-direction:row;padding:1.7em 0 .9em 1.1em}
.peek{flex:1;border-left:1px solid var(--p-line);margin-left:.8em;background:repeating-linear-gradient(var(--p-paper) 0 1.6em,var(--p-line) 1.6em calc(1.6em + 1px))}
.side{width:9.6em;flex:none;display:flex;flex-direction:column;gap:.45em;min-height:0}
.mon{display:flex;flex-direction:column;align-items:center;line-height:1}
.mon .m{font-family:var(--num);font-weight:700;font-size:3.2em;color:var(--p-main)}
.mon .t{font-family:var(--num);font-weight:600;font-size:.8em;letter-spacing:.08em;margin-top:.15em}
.slot{border-radius:.3em;position:relative;min-height:0;transition:box-shadow .2s}
.slot.top{flex:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em}
.slot.bot{flex:1;display:flex;flex-direction:column;gap:.25em;padding:.3em .35em;border:1px solid var(--p-line)}
.focus-top .slot.top,.focus-bottom .slot.bot{box-shadow:0 0 0 .18em var(--p-accent2)}
.art{width:100%;max-height:5.2em}
.art.pl{width:auto;height:5em}
.slot .cap{font-family:var(--hand);font-size:.75em;color:var(--p-muted)}
.s2{flex-direction:row!important;gap:.4em!important;padding:0 .2em}
.s2 .art.pl{height:4.6em;flex:none}
.bio{display:flex;flex-direction:column;gap:.28em;flex:1;min-width:0}
.bio b{font-size:.62em;color:var(--p-main)}
.bio i,.lines i,.kv i,.slot .ln{display:block;height:.18em;background:var(--p-line);border-radius:1em}
.mini .mt{font-family:var(--num);font-weight:700;font-size:.62em;letter-spacing:.08em;color:var(--p-main)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:.05em .1em;font-family:var(--num);font-size:.5em;text-align:center;line-height:1.25}
.mg .sun{color:var(--p-sun)}
.slot .lab{font-family:var(--hand);font-size:.75em;color:var(--p-main)}
.mvp{display:flex;gap:.4em;align-items:center;flex:1}
.mvp .frame{width:2.4em;height:2.8em;border:1px dashed var(--p-muted);border-radius:.25em;display:grid;place-items:center;color:var(--p-accent2);font-size:.9em;flex:none}
.lines{flex:1;display:flex;flex-direction:column;gap:.6em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25em .35em;align-items:end;font-size:.55em;color:var(--p-muted)}
.kv i{align-self:center}
.b3 .ln{margin-top:.5em}
.hd{display:flex;align-items:baseline;gap:.5em;margin-bottom:.4em}
.hd .m{font-family:var(--num);font-weight:700;font-size:2.6em;line-height:.9;color:var(--p-main)}
.hd .t{font-family:var(--num);font-weight:600;font-size:.95em;letter-spacing:.08em}
.hd .tag{margin-left:auto;font-family:var(--hand);font-size:1.05em;color:var(--p-main)}
.body{display:flex;gap:.6em;flex:1;min-height:0}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(5,1fr);border-top:.12em solid var(--p-main);min-width:0}
.dw{font-family:var(--num);font-size:.7em;font-weight:600;text-align:left;padding:.15em .25em;letter-spacing:.05em}
.dw.sun{color:var(--p-sun)}
.dc{border-right:1px solid var(--p-line);border-bottom:1px solid var(--p-line);position:relative;padding:.12em .2em;min-height:0;overflow:hidden}
.dc:nth-child(7n+1){border-left:1px solid var(--p-line)}
.dc .d{font-family:var(--num);font-size:.68em;font-weight:600;line-height:1}
.dc.sun .d{color:var(--p-sun)}
.dc .stk{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.12em}
.memo{width:28%;display:flex;flex-direction:column;gap:.15em;border-top:.12em solid var(--p-main);padding-top:.25em;min-width:0}
.memo .lab{font-family:var(--hand);font-size:.9em;color:var(--p-main)}
.memo .ln{flex:1;border-bottom:1px dashed var(--p-line)}
.free{width:36%;border:.12em dashed var(--p-line);border-radius:.4em;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--hand);font-size:.9em;color:var(--p-muted);padding:.4em;min-width:0}
.l3 .dc .d{font-size:.6em}

/* stickers */
.em{display:block;width:1.6em;height:1.6em;aspect-ratio:1;border-radius:50%;object-fit:cover;background:#fff;border:.1em solid #fff;box-shadow:0 .08em .2em rgba(0,0,0,.3);flex:none;max-width:none}
.res{width:.9em;height:.9em;border-radius:50%;color:#fff;font-family:var(--num);font-weight:700;font-size:.62em;display:grid;place-items:center;line-height:1;flex:none;width:1.35em;height:1.35em}
.res{aspect-ratio:1}
.res.w{background:#d6263b}.res.l{background:#3866c7}.res.d{background:#8a8f99}
.dot{width:.45em;height:.45em;border-radius:50%;flex:none}
.lbl{font-family:var(--hand);font-size:.72em;line-height:1;padding:.18em .45em;border-radius:.15em;color:#fff;transform:rotate(-4deg);white-space:nowrap;flex:none;box-shadow:0 .05em .1em rgba(0,0,0,.2)}
.lbl::before{content:"";display:inline-block;width:.45em;height:.45em;border-radius:50%;background:rgba(255,255,255,.85);margin-right:.25em;vertical-align:middle}
.ball{width:1.6em;height:1.6em;flex:none}
.ev{font-family:var(--hand);font-size:.62em;line-height:1.1;padding:.15em .35em;border-radius:.3em;border:.1em solid currentColor;white-space:nowrap;flex:none}

.hacell{width:15em;height:10.5em;background:var(--p-paper);border:.12em solid var(--p-main);border-radius:.3em;position:relative;color:var(--p-ink)}
.hd14{position:absolute;left:.5em;top:.3em;font-family:var(--num);font-weight:700;font-size:1.8em}
.words{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:1.1em;font-family:var(--num);font-weight:600;font-size:1.3em;letter-spacing:.06em;color:var(--p-muted)}
.words>span{position:relative}
.pair{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:.6em}
.pair .drop{position:relative;left:auto;top:auto}
.drop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.1em;display:block;line-height:0}
.words .drop{font-size:1.75em}
.hatag{display:inline-block;color:#fff;font-family:var(--num);font-weight:700;font-size:.55em;letter-spacing:.06em;line-height:1;padding:.35em .55em;border-radius:.35em;box-shadow:0 .06em .15em rgba(0,0,0,.25)}
.drop .hatag{font-size:.36em}
.hacap{margin-top:.6em;font-size:.72em;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .words .drop{animation:dropA 3.4s ease-out infinite}
  .pair .drop{animation:dropB 3.4s ease-out infinite}
  .pair .drop.d2{animation-delay:.35s}
}
@keyframes dropA{0%,8%{opacity:0;transform:translate(-50%,-260%) rotate(-25deg) scale(1.3)}24%{opacity:1;transform:translate(-50%,-50%) rotate(5deg) scale(1)}30%,86%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%)}}
@keyframes dropB{0%,8%{opacity:0;transform:translateY(-220%) rotate(-25deg) scale(1.3)}24%{opacity:1;transform:translateY(0) rotate(5deg) scale(1)}30%,86%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.rbrow{display:grid;grid-template-columns:repeat(2,auto);gap:1.1em 1.6em;justify-content:center;align-items:center}
.rbcell{display:flex;flex-direction:column;align-items:center;gap:.35em;font-size:.7em;color:var(--muted)}
.rbcell .rb,.rbcell .face{font-size:1.43em}
.rb{display:inline-grid;place-items:center;flex:none;line-height:1;white-space:nowrap}
.rb1{width:3em;height:3em;aspect-ratio:1;border-radius:50%;color:#fff;font-family:var(--body);font-weight:700;font-size:1em;border:.18em solid #fff;box-shadow:0 .1em .3em rgba(0,0,0,.28)}
.rb1:not(:empty){letter-spacing:-.02em}
.rb2{min-width:3.4em;height:2.6em;padding:0 .5em;border:.14em solid;border-radius:.35em;background:#fff;font-family:var(--hand);font-weight:700;font-size:1.05em;box-shadow:0 .1em .25em rgba(0,0,0,.18)}
.face{width:3.4em;height:3.4em;flex:none;filter:drop-shadow(0 .1em .15em rgba(0,0,0,.22))}
.mini-b{font-size:.42em;display:inline-flex}
.stage-mock{position:relative}
.corner{position:absolute;left:.7cqi;bottom:.7cqi;display:flex;flex-direction:column;gap:.3em;align-items:flex-start}
.ccell{width:7.5em;height:5.2em;background:#f7f5ef;border:1px solid #d6d3c8;border-radius:.25em;position:relative;box-shadow:0 .15em .4em -.15em rgba(0,0,0,.35)}
.ccell .d,.evcell .d{position:absolute;left:.4em;top:.25em;font-family:var(--num);font-weight:700;font-size:1em;color:#1c2740}
.ccell .cc{position:absolute;inset:.9em 0 0 0;display:flex;align-items:center;justify-content:center;gap:.3em}
.ccap{font-size:.85em;color:var(--muted)}
.fixed{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1cqi 1.2cqi;display:flex;flex-direction:column;gap:.7cqi}
.fixed .tag{font-family:var(--num);font-weight:700;font-size:1.2cqi;letter-spacing:.1em;color:var(--accent)}
.fixed .fact{font-size:1.2cqi}
.listgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:2cqi;flex:1;min-height:0}
.sheetbox{background:var(--ground);border-radius:6px;display:grid;place-items:center;padding:1.6cqi;min-width:0}
.sheetcard{background:#fbfaf6;color:#1c2740;border-radius:.6cqi;padding:1.6cqi;box-shadow:0 .5cqi 1.4cqi -.6cqi rgba(0,0,0,.45);display:flex;flex-direction:column;gap:1.4cqi;width:100%}
.sheetcard .sh{display:flex;justify-content:space-between;font-family:var(--num);font-weight:700;font-size:1.25cqi;letter-spacing:.08em}
.evrow{display:flex;flex-wrap:wrap;gap:1cqi}
.evs{display:inline-flex;align-items:center;gap:.4em;font-weight:700;font-size:1.7cqi;color:#fff;background:var(--c);padding:.55em 1em;border-radius:99px;border:.2em solid #fff;box-shadow:0 .15em .4em rgba(0,0,0,.25);white-space:nowrap}
.evs::before{content:"★";font-size:.75em;opacity:.85}
.evs.sm{font-size:.95cqi}
.evcell{position:relative;width:12cqi;height:8cqi;background:#f7f5ef;border:1px solid #d6d3c8;border-radius:.3cqi;display:grid;place-items:center;align-self:flex-start;font-size:1.3cqi}
.evcell .d2{position:absolute;left:0;bottom:-2cqi;font-size:1cqi;color:#5d6577;white-space:nowrap}
.fanrow{display:grid;grid-template-columns:1fr 1fr;gap:1cqi 1.4cqi}
.fan{display:flex;align-items:stretch;border:.18cqi solid var(--c);border-radius:.5cqi;overflow:hidden;background:#fff;box-shadow:0 .15cqi .4cqi rgba(0,0,0,.18);font-size:1.45cqi;min-width:0}
.fan b{background:var(--c);color:#fff;padding:.5em .8em;white-space:nowrap;font-weight:700}
.fan i{flex:1;margin:.45em .7em;border-bottom:.12cqi dashed #b9bcc4;font-style:normal;font-family:var(--hand);color:#5d6577;font-size:1.05em;line-height:1.4;min-width:0}
.ideas{display:flex;flex-direction:column;gap:1cqi;min-width:0;min-height:0}
.ilab{font-weight:700;font-size:1.5cqi}
.add{display:flex;gap:.8cqi}
.add input{flex:1;min-width:0;font:inherit;font-size:1.35cqi;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.7cqi 1cqi}
.add button{font:inherit;font-size:1.35cqi;font-weight:700;color:var(--card);background:var(--sel);border:0;border-radius:4px;padding:0 1.6cqi;cursor:pointer}
.add input:focus-visible,.add button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ichips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.7cqi;overflow:auto;min-height:0;align-content:flex-start;flex:1}
.ichips li{display:inline-flex;align-items:center;gap:.6em;font-size:1.3cqi;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.35em .5em .35em 1em}
.ichips li.empty{border-style:dashed;color:var(--muted);padding:.5em 1em}
.ichips button{font:inherit;line-height:1;width:1.6em;height:1.6em;border-radius:50%;border:0;background:var(--ground);color:var(--muted);cursor:pointer}
@media (max-width:760px){
  .listgrid{grid-template-columns:1fr}
  .fixed .tag,.fixed .fact{font-size:12px}
  .sheetcard{padding:14px;gap:12px} .sheetcard .sh{font-size:12px}
  .evs{font-size:15px} .evs.sm{font-size:10px} .evcell{width:110px;height:72px} .evcell .d2{font-size:11px;bottom:-18px}
  .fanrow{grid-template-columns:1fr} .fan{font-size:14px}
  .ilab{font-size:15px} .add input,.add button{font-size:15px;padding:8px 10px} .ichips li{font-size:14px}
}
.pack2{display:flex;align-items:center;gap:.6em;flex-wrap:nowrap}
.pgroup{display:flex;gap:.5em;align-items:flex-end;padding:.5em;border-radius:.4em}
.pgroup.opt{border:.1em dashed var(--muted)}
.pitem{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.62em;color:var(--muted);text-align:center;width:6.2em}
.pitem b{font-weight:700;color:var(--ink);line-height:1.25}
.pitem em{font-style:normal;color:var(--accent);font-weight:700}
.pcal{width:6em;height:4.6em;background:#f7f5ef;border:.18em solid #1c2a4a;border-radius:.3em;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#1c2a4a;box-shadow:0 .3em .7em -.4em rgba(0,0,0,.5)}
.pcal .m{font-family:var(--num);font-weight:700;font-size:2em}
.pcal .t{font-family:var(--num);font-size:.7em;letter-spacing:.06em}

  if(key==="pack") return {html:packMock(o),size:(o.pack===1?1.2:o.pack===2?.95:.78)};
  return {html:materialMock(o),size:1.7};
}

var LISTS=[

        '<div class="bf"><span>COLOR</span><b>클래식 볼파크</b><p>네이비와 레드, 아이보리 종이</p></div>'+

    } else if(S.t==="d"){

      var cards=x.opts.map(function(o,j){
        return '<button type="button" class="opt" data-k="'+x.key+'" data-o="'+(j+1)+'" aria-pressed="false"><span class="badge">선택됨</span><span class="no">OPTION '+(j+1)+'</span><div class="stage-mock"></div><h3>'+esc(o.t)+'</h3><p class="desc">'+esc(o.d)+'</p><div class="facts">'+o.f.map(function(f){return '<span class="fact">'+esc(f[0])+' <b>'+esc(f[1])+'</b></span>'}).join("")+'</div></button>';

      h='<section class="slide"><div class="in"><div class="top"><span class="eyebrow">결정 '+(di+1)+' / '+D.length+' · '+esc(x.q)+'</span><span class="hint">'+esc(x.hint)+'</span></div><h2>'+esc(x.title)+'</h2><div class="opts">'+cards+'</div></div>'+pg(n+1)+'</section>';
    } else if(S.t==="list"){
      var l=S.l; SLIDE_OF["list-"+l.kind]=n;
      h='<section class="slide"><div class="in"><div class="top"><span class="eyebrow">스티커 구성 · '+esc(l.q)+'</span><span class="hint">'+esc(l.hint)+'</span></div><h2>'+esc(l.title)+'</h2>'+
        '<div class="listgrid"><div class="sheetbox">'+l.sheet()+'</div><div class="ideas"><label class="ilab" for="in-'+l.kind+'">'+esc(l.label)+'</label>'+
        '<form class="add" data-kind="'+l.kind+'"><input id="in-'+l.kind+'" maxlength="40" autocomplete="off" placeholder="'+esc(l.ph)+'"><button type="submit">추가</button></form>'+
        '<ul class="ichips" id="list-'+l.kind+'"></ul><p class="status">적은 내용은 이 보드를 보는 사람 모두에게 보여요.</p></div></div></div>'+pg(n+1)+'</section>';
    } else if(S.t==="sum"){
      h='<section class="slide"><div class="in"><div class="eyebrow">Summary · 고른 조합</div><h2 id="sumTitle">지금 고른 조합으로 만든 샘플</h2>'+
        '<div class="sumgrid"><div class="list"><div class="list" id="sumList"></div><label class="status" for="note">결정 메모 (함께 볼 사람에게 남길 말)</label><textarea class="note" id="note" placeholder="예: 스티커는 표정 공으로, 대신 결과 배지도 같이 넣기"></textarea></div>'+
        '<div class="preview col" id="sumPrev"></div></div></div>'+pg(n+1)+'</section>';
    } else {
      h='<section class="slide"><div class="in"><div class="top"><span class="eyebrow">Size Guide · 크기 예측</span><span class="hint">예측치예요. 인쇄소 규격과 샘플 출력으로 확정해요.</span></div>'+
        '<h2>날짜 한 칸 약 20 × 19mm, 스티커는 이 크기로</h2><div class="sizegrid"><div style="display:flex;flex-direction:column;gap:1.2cqi;min-width:0">'+
        '<div class="assume"><span class="fact">달력 판형 <b>220 × 150mm 가정</b></span><span class="fact">왼쪽 패널 <b>55mm</b></span><span class="fact">날짜 영역 <b>144 × 118mm</b></span><span class="fact">한 칸 <b>약 20.5 × 19.5mm (6주 달)</b></span><span class="fact">5주 달은 <b>약 20.5 × 23.5mm</b></span></div>'+
        '<table class="stab"><thead><tr><th>스티커</th><th>권장 크기</th><th>시즌 수량 참고</th></tr></thead><tbody>'+
        '<tr><td>상대팀 로고 <small>(기본)</small></td><td><b>지름 9mm</b></td><td>9개 구단 × 16경기, 구단별 18장</td></tr>'+
        '<tr><td>경기 결과 <small>(기본)</small></td><td>원형 <b>지름 6mm</b> · 손글씨 <b>8 × 6mm</b> · 야구공 <b>지름 7mm</b></td><td>144경기: 승 · 패 각 80, 무 10, 취소 15</td></tr>'+
        '<tr><td>홈 · 원정 <small>(옵션 2)</small></td><td>태그 <b>7 × 4mm</b> · 옵션 1은 인쇄 글자 높이 2mm</td><td>홈 · 원정 각 75</td></tr>'+
        '<tr><td>이벤트</td><td><b>16 × 4.5mm</b> 라벨</td><td>종류별 3~10장</td></tr>'+
        '<tr><td>찐팬 (이름 칸)</td><td><b>18 × 4.5mm</b> (글자 7 + 이름 11mm)</td><td>종류별 5~10장</td></tr>'+
        '</tbody></table><p class="status">한 칸에 가장 많이 붙는 경우: 상대팀 + 결과 + 이벤트(또는 찐팬) 3장, 홈 · 원정 스티커를 쓰면 4장. 오른쪽 그림처럼 위 줄 17mm, 아래 줄 16mm에 들어가요.</p></div>'+
        '<div class="cellfig">'+cellFigure()+'<p>실제 비율로 그린 날짜 한 칸 (6주 달 기준)</p></div></div></div>'+pg(n+1)+'</section>';
    }
    var sec=el(h);
    if(S.t!=="sum"){var jb=document.createElement("button");jb.type="button";jb.className="jump";jb.textContent="☰ 고른 조합 보기";jb.setAttribute("aria-label","고른 조합 페이지로 이동");jb.addEventListener("click",function(e){e.stopPropagation();show(SLIDES.findIndex(function(x){return x.t==="sum"}))});sec.insertBefore(jb,sec.firstChild)}
    stage.appendChild(sec);
  });
  stage.querySelectorAll(".opt").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();choose(b.dataset.k,+b.dataset.o)})});
  stage.querySelectorAll("form.add").forEach(function(f){
    f.addEventListener("click",function(e){e.stopPropagation()});
    f.addEventListener("submit",function(e){e.preventDefault();var inp=f.querySelector("input"),t=inp.value.trim();if(!t)return;addIdea(f.dataset.kind,t);inp.value=""});
  });
  stage.querySelectorAll("input,textarea").forEach(function(x){x.addEventListener("keydown",function(e){e.stopPropagation()})});
  var note=document.getElementById("note");
  note.addEventListener("click",function(e){e.stopPropagation()});
  var nt; note.addEventListener("input",function(){clearTimeout(nt);nt=setTimeout(function(){state.note=note.value;persist()},700)});
}
function ideaCount(kind){return ideas.filter(function(x){return x.kind===kind}).length}
function rowsHTML(){
  var rows=[],n=0;
  D.forEach(function(x){
    var c=state[x.key]; n++;
    rows.push('<button type="button" class="row" data-go="'+SLIDE_OF[x.key]+'"><span class="n">'+n+'</span><span class="k">'+esc(x.q)+'</span><span class="v'+(c?" done":"")+'">'+(c?"OPTION "+c+" · "+esc(x.opts[c-1].t):"아직 안 정했어요")+'</span></button>');
    if(x.key==="sticker") LISTS.forEach(function(l){
      var k=ideaCount(l.kind); n++;
      rows.push('<button type="button" class="row" data-go="'+SLIDE_OF["list-"+l.kind]+'"><span class="n">'+n+'</span><span class="k">'+esc(l.q)+'</span><span class="v done">기본 '+(l.kind==="event"?5:8)+'종'+(k?" + 의견 "+k+"개":"")+'</span></button>');
    });
  });
  return rows.join("");
}
function renderIdeas(){
  LISTS.forEach(function(l){
    var ul=document.getElementById("list-"+l.kind), items=ideas.filter(function(x){return x.kind===l.kind});
    ul.innerHTML=items.length?items.map(function(x){return '<li><span>'+esc(x.text)+'</span><button type="button" data-id="'+esc(x.id)+'" aria-label="'+esc(x.text)+' 지우기">×</button></li>'}).join(""):'<li class="empty">아직 없어요. 위 칸에 적고 추가를 눌러 주세요.</li>';
    ul.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();removeIdea(b.dataset.id)})});
  });
}
function render(){
  stage.querySelectorAll(".opt").forEach(function(b){
    var k=b.dataset.k,o=+b.dataset.o, sel=state[k]===o;
    b.classList.toggle("sel",sel); b.setAttribute("aria-pressed",sel?"true":"false");
    var m=mockFor(k,o), box=b.querySelector(".stage-mock");
    box.innerHTML=m.html; box.firstChild.style.setProperty("--mk",m.size+"cqi"); box.firstChild.style.setProperty("--mk-m",(m.size*6)+"px");
  });
  var done=D.filter(function(x){return state[x.key]}).length;
  ["coverList","sumList"].forEach(function(id){var e=document.getElementById(id);e.innerHTML=rowsHTML();
    e.querySelectorAll(".row").forEach(function(r){r.addEventListener("click",function(ev){ev.stopPropagation();show(+r.dataset.go)})})});
  var o=cur();
  var cp=document.getElementById("coverPrev"); cp.innerHTML=calMock(o); cp.firstChild.style.setProperty("--mk","1.36cqi"); cp.firstChild.style.setProperty("--mk-m","8px");
  var sp=document.getElementById("sumPrev"); sp.innerHTML=calMock(o)+sheetMock(o,true);
  sp.children[0].style.setProperty("--mk","1.05cqi"); sp.children[1].style.setProperty("--mk","1.05cqi");
  sp.children[0].style.setProperty("--mk-m","8px"); sp.children[1].style.setProperty("--mk-m","9px");
  document.getElementById("sumTitle").textContent = done===D.length?"이 조합으로 샘플 출력을 맡겨요":"지금 고른 조합으로 만든 샘플 ("+done+"/"+D.length+" 결정)";
  var note=document.getElementById("note"); if(document.activeElement!==note) note.value=state.note||"";
  document.getElementById("st0").textContent=done+"/"+D.length+" 결정 · 정하지 않은 항목은 OPTION 1로 미리 보여요.";
  [].forEach.call(dots.children,function(x,k){var S=SLIDES[k];x.classList.toggle("done",!!(S&&S.t==="d"&&state[S.x.key]))});
  renderIdeas();
}
function choose(k,o){state[k]=state[k]===o?null:o; render(); persist()}

/* ---------- persistence ---------- */
var saveEl=document.getElementById("save"), ideas=[], ideasCol=null, LSI="baseball-cal-ideas-v1";
try{ideas=JSON.parse(localStorage.getItem(LSI)||"[]")||[]}catch(e){ideas=[]}
function saveLocalIdeas(){try{localStorage.setItem(LSI,JSON.stringify(ideas))}catch(e){}}
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!ref){saveEl.textContent="이 브라우저에 저장됨";return}
  var body={}; D.forEach(function(x){body[x.key]=state[x.key]}); body.note=state.note||""; body.updatedAt=new Date().toISOString();
  saveEl.textContent="저장 중…";
  writing=writing.then(function(){return ref.set(body)}).then(function(){saveEl.textContent="저장됨 · 공유 중"},function(e){
    saveEl.textContent=(e&&e.code==="invalid_argument")?"보기 전용이에요 (이 브라우저에만 저장)":"저장 실패 · 이 브라우저에만 저장됨";
  });
}
function addIdea(kind,text){
  if(ideasCol){
    saveEl.textContent="저장 중…";
    ideasCol.add({kind:kind,text:text,createdAt:new Date().toISOString()}).then(function(){saveEl.textContent="저장됨 · 공유 중"},function(e){
      saveEl.textContent=(e&&e.code==="invalid_argument")?"보기 전용이에요":"저장 실패";
    });
  } else {
    ideas.push({id:"l"+Date.now(),kind:kind,text:text}); saveLocalIdeas(); render(); saveEl.textContent="이 브라우저에 저장됨";
  }
}
function removeIdea(id){
  if(ideasCol){ideasCol.doc(id).delete().catch(function(){saveEl.textContent="지우기 실패"})}
  else {ideas=ideas.filter(function(x){return x.id!==id}); saveLocalIdeas(); render()}
}
if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(x){
    if(!x) return; db=x; ref=db.doc("decisions/current"); ideasCol=db.collection("ideas");
    ref.onSnapshot(function(snap){
      if(!snap.exists){saveEl.textContent="공유 저장 준비됨";return}
      var d=snap.data(); D.forEach(function(x){state[x.key]=d[x.key]||null}); state.note=d.note||"";
      if(!snap.metadata.hasPendingWrites) saveEl.textContent="저장됨 · 공유 중";
      render();
    },function(){saveEl.textContent="이 브라우저에 저장됨"});
    ideasCol.orderBy("createdAt").onSnapshot(function(q){
      ideas=q.docs.map(function(d){var b=d.data();return {id:d.id,kind:b.kind,text:String(b.text||"")}});
      render();
    },function(){ideasCol=null});
  });
}

/* ---------- navigation ---------- */
var i=0, dots=document.getElementById("dots");
build();
for(var k=0;k<N;k++){(function(k){var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",(k+1)+"번 슬라이드");b.onclick=function(){show(k)};dots.appendChild(b)})(k)}
function show(n){
  i=Math.max(0,Math.min(N-1,n));
  stage.querySelectorAll(".slide").forEach(function(s,k){s.classList.toggle("on",k===i)});
  [].forEach.call(dots.children,function(x,k){x.classList.toggle("on",k===i)});
}
document.getElementById("prev").onclick=function(){show(i-1)};
(function(){var rb=document.getElementById("reset"),armed=0,t;
  rb.onclick=function(){
    if(!armed){armed=1;rb.classList.add("arm");rb.textContent="한 번 더 누르면 초기화";t=setTimeout(function(){armed=0;rb.classList.remove("arm");rb.textContent="선택 초기화"},4000);return}
    clearTimeout(t);armed=0;rb.classList.remove("arm");rb.textContent="선택 초기화";
    D.forEach(function(x){state[x.key]=null}); state.note=""; render(); persist(); saveEl.textContent="선택을 모두 지웠어요";
  };
})();
document.getElementById("next").onclick=function(){show(i+1)};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();show(i+1)}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(i-1)}
});
render(); show(0);
saveEl.textContent=saveEl.textContent||"이 브라우저에 저장됨";
})();
</script>
